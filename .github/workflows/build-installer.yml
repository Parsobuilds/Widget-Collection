name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and verify installer
        env:
          DESKTOP_WIDGETS_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
        run: python build.py
      - name: Upload unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: DesktopWidgets-Setup
          path: dist/DesktopWidgets-Setup-*.exe
          if-no-files-found: error
      - name: Request SignPath signature
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: desktop-widgets
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Upload signed installer
        if: env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DesktopWidgets-Setup-Signed
          path: signed/**
          if-no-files-found: error
