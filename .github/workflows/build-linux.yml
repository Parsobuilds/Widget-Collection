name: build-linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # TEMPORARY (removed in the next commit): one run on linux-port, because
    # workflow_dispatch only works once this file is on the default branch (run 2).
    branches: ["linux-port"]
    paths: [".github/workflows/build-linux.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt offscreen libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Build, test, freeze and pack
        run: python build.py --linux
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopWidgets-linux
          path: dist/DesktopWidgets-*-linux-x86_64.tar.gz
          if-no-files-found: error
